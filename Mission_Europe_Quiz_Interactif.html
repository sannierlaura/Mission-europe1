<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Europe — Escape quiz</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#f7fbff;background:#071c42}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 5%,#2457a0,#071c42 65%);min-height:100vh}.wrap{max-width:960px;margin:auto;padding:26px 18px 65px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:900;letter-spacing:.1em;color:#ffd454}.chip{border:1px solid #6d9bd3;border-radius:50px;padding:8px 12px;font-size:13px}.bar{height:9px;border-radius:20px;background:#29436b;margin:24px 0;overflow:hidden}.fill{height:100%;background:#ffd454;width:0%;transition:.3s}h1{font-size:clamp(35px,6vw,60px);line-height:1.06;margin:22px 0}h2{font-size:clamp(24px,4vw,37px)}p{line-height:1.55;color:#d4e6fc}.panel{background:#102f61;border:1px solid #4777ae;border-radius:22px;padding:clamp(20px,4vw,40px);box-shadow:0 15px 45px #0003}.eyebrow{color:#ffd454;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px}.btn,.option{font:inherit;cursor:pointer;border-radius:12px;padding:13px 18px;border:2px solid #6594cb;background:#1b447b;color:white;font-weight:650}.btn{background:#ffcf48;color:#112b57;border:0;margin-top:16px}.btn:hover,.option:hover{filter:brightness(1.13)}.option{display:block;text-align:left;width:100%;margin:10px 0}.option.selected{border-color:#ffce46;background:#315e9b}input{background:#f7fbff;color:#102b5b;border:3px solid #9dc6f3;border-radius:12px;padding:14px;font-size:21px;max-width:100%;width:270px}.feedback{margin-top:14px;font-weight:700;min-height:24px}.good{color:#8aefb4}.bad{color:#ffb3a5}.hidden{display:none!important}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tag{border-radius:100px;background:#1c497e;padding:7px 12px;font-size:13px}.gridletters{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:560px;margin:22px auto}.cell{border:1px solid #5b89bd;border-radius:7px;background:#174475;aspect-ratio:1;display:grid;place-items:center;font-weight:800;font-size:clamp(12px,2.8vw,21px);cursor:pointer;user-select:none}.cell.active{background:#ffcf48;color:#122d5c}.cell.found{background:#4cbd90;color:#09244b}.timeline{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;margin:18px 0}.timeline select{width:100%;padding:11px;background:white;color:#102b5b;border-radius:8px;font-size:16px}.timeline label{font-weight:650}.small{font-size:13px}.stars{font-size:32px;letter-spacing:10px;color:#ffcf48}.foot{margin-top:28px;font-size:12px;color:#a9c6e8}@media(max-width:520px){.timeline{grid-template-columns:1fr}.gridletters{gap:2px}.cell{border-radius:3px}}
</style></head><body><main class="wrap"><header><div class="logo">★ MISSION EUROPE</div><div class="chip" id="counter">Défi 0 / 10</div></header><div class="bar"><div class="fill" id="progress"></div></div><section class="panel" id="stage"></section><div class="foot">D’après l’exposition « L’Union européenne en un clin d’œil ». Certaines dates désignent la signature d’un traité, pas son entrée en vigueur.</div></main><script>
const Q=[["qcm", "Quel symbole figure sur le drapeau européen ?", ["12 étoiles dorées", "27 étoiles dorées", "Une colombe blanche"], 0, "Les 12 étoiles symbolisent l’unité et l’harmonie, et non le nombre d’États."], ["number", "Combien de pays composent l’Union européenne ?", "27", "L’UE compte 27 États membres."], ["number", "En quelle année les traités de Rome ont-ils été signés ?", "1957", "Les traités de Rome datent de 1957."], ["qcm", "Quelle institution est élue directement par les citoyens de l’UE ?", ["La Commission européenne", "Le Parlement européen", "La Cour de justice"], 1, "Les députés du Parlement européen sont élus au suffrage universel direct."], ["number", "En quelle année l’accord de Schengen a-t-il été signé ?", "1985", "L’accord de Schengen a été signé en 1985 ; sa mise en œuvre est postérieure."], ["qcm", "Quelle devise est celle de l’Union européenne ?", ["Unis dans la diversité", "Liberté, égalité, fraternité", "Un peuple, une langue"], 0, "La devise européenne est « Unie dans la diversité »."], ["number", "En quelle année le traité de Maastricht a-t-il été signé ?", "1992", "Le traité a été signé en 1992 et est entré en vigueur en 1993."], ["qcm", "Quel est le rôle principal de la Commission européenne ?", ["Proposer des textes législatifs", "Élire les députés européens", "Diriger les tribunaux nationaux"], 0, "La Commission propose notamment des actes législatifs et veille à l’application du droit de l’UE."], ["number", "En quelle année les billets et pièces en euros sont-ils entrés en circulation ?", "2002", "Les espèces en euros sont apparues en 2002."], ["qcm", "Laquelle de ces priorités correspond à l’action de l’UE ?", ["Protéger l’environnement", "Supprimer toutes les langues nationales", "Interdire les échanges entre pays"], 0, "La protection de l’environnement fait partie des priorités de l’Union européenne."]];let step=-1,chosen=-1,score=0,unlocked=false;const stage=document.querySelector('#stage');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function header(){document.querySelector('#counter').textContent='Défi '+Math.min(Math.max(step+1,0),10)+' / 10';document.querySelector('#progress').style.width=(Math.max(0,step+1)/10*100)+'%'}function render(){header();if(step===-1){stage.innerHTML=`<div class="eyebrow">Escape quiz • Lycée</div><h1>L'Europe en un clin d'œil</h1><div class="stars">★ ★ ★</div><p>10 défis, un mot mêlé obligatoire et une frise chronologique. Observe les panneaux de l'exposition pour trouver les réponses !</p><div class="meta"><span class="tag">⏱ 20–30 minutes</span><span class="tag">🔒 Déblocage par énigme</span><span class="tag">⌨ Dates à saisir</span></div><button class="btn" onclick="next()">Commencer la mission →</button>`;return}if(step===5&&!unlocked){wordGame();return}if(step===8){timeline();return}if(step===10){stage.innerHTML=`<div class="eyebrow">Mission accomplie</div><h1>Bravo ! 🇪🇺</h1><p>Tu as terminé les dix défis, déchiffré le mot mêlé et reconstitué la chronologie.</p><h2>Score : ${score} / 10</h2><button class="btn" onclick="location.reload()">Recommencer ↻</button>`;return}let q=Q[step];chosen=-1;stage.innerHTML=`<div class="eyebrow">Défi ${step+1} sur 10</div><h2>${escapeHTML(q[1])}</h2><p>${q[0]==='number'?'Saisis la réponse exacte (chiffres uniquement).':'Sélectionne une seule réponse.'}</p>${q[0]==='qcm'?q[2].map((v,i)=>`<button class="option" onclick="choose(${i})" id="opt${i}">${String.fromCharCode(65+i)}. ${escapeHTML(v)}</button>`).join(''):`<input id="answer" inputmode="numeric" autocomplete="off" placeholder="Ta réponse" onkeydown="if(event.key==='Enter')verify()">`}<div class="feedback" id="feedback" aria-live="polite"></div><button class="btn" id="verify" onclick="verify()">Valider →</button>`}function choose(i){chosen=i;document.querySelectorAll('.option').forEach((x,k)=>x.classList.toggle('selected',k===i))}function verify(){let q=Q[step],a=q[0]==='number'?document.querySelector('#answer').value.trim():chosen,ok=a===q[3===q.length?2:3];if(q[0]==='qcm')ok=a===q[3];if(q[0]==='number')ok=a===q[2];let fb=document.querySelector('#feedback');if(ok){score++;fb.className='feedback good';fb.textContent='✓ Exact ! '+q[q.length-1];document.querySelector('#verify').textContent='Continuer →';document.querySelector('#verify').onclick=next;document.querySelectorAll('.option,input').forEach(e=>e.disabled=true)}else{fb.className='feedback bad';fb.textContent='Pas encore ! Relis le panneau et réessaie.'}}function next(){step++;render()}
const rows=['EUROPEABCD','SOLIDARITE','DEMOCRATIE','PAIXLKMNOP','DIVERSITEQ','PARLEMENTX','TRAITEABCD','UNIONFGHIJ','CITOYENKLM','ETOILESXYZ'];const targets=['PAIX','UNION','EUROPE','TRAITE'];let found=new Set(),sel=[];function wordGame(){stage.innerHTML=`<div class="eyebrow">Étape secrète • Verrou 1</div><h2>🔒 Le mot mêlé de l'Europe</h2><p>Trouve les <b>4 mots</b> : PAIX, UNION, EUROPE, TRAITÉ (sans accent dans la grille). Clique sur la première puis sur la dernière lettre de chaque mot, sur une même ligne. Tu dois tout trouver pour continuer.</p><div class="meta" id="words"></div><div class="gridletters" id="letters"></div><div class="feedback" id="feedback"></div><button class="btn hidden" id="unlock" onclick="unlocked=true;render()">🔓 Accéder au défi 6 →</button>`;let grid=document.querySelector('#letters');rows.forEach((r,y)=>[...r].forEach((c,x)=>{let el=document.createElement('div');el.className='cell';el.textContent=c;el.dataset.y=y;el.dataset.x=x;el.onclick=()=>tap(y,x);grid.append(el)}));updateWords()}function updateWords(){document.querySelector('#words').innerHTML=targets.map(w=>`<span class="tag">${found.has(w)?'✓ ':'○ '}${w}</span>`).join('');if(found.size===targets.length){document.querySelector('#unlock').classList.remove('hidden');document.querySelector('#feedback').textContent='Bravo ! Le verrou est ouvert.'}}function tap(y,x){sel.push([y,x]);if(sel.length<2)return;let [[y1,x1],[y2,x2]]=sel;sel=[];if(y1!==y2){document.querySelector('#feedback').textContent='Choisis deux lettres sur la même ligne.';return}let lo=Math.min(x1,x2),hi=Math.max(x1,x2),word=rows[y1].slice(lo,hi+1);if(targets.includes(word)&&!found.has(word)){found.add(word);document.querySelectorAll('.cell').forEach(el=>{if(+el.dataset.y===y1&&+el.dataset.x>=lo&&+el.dataset.x<=hi)el.classList.add('found')});document.querySelector('#feedback').textContent='✓ '+word+' trouvé !';updateWords()}else document.querySelector('#feedback').textContent='Ce n’est pas l’un des quatre mots recherchés.'}
const events=[['Création de la CECA','1951'],['Signature des traités de Rome','1957'],['Signature de l’accord de Schengen','1985'],['Signature du traité de Maastricht','1992'],['Mise en circulation des billets et pièces en euros','2002']];function timeline(){stage.innerHTML=`<div class="eyebrow">Défi 9 • Frise chronologique</div><h2>📅 Remets l'Europe dans le temps</h2><p>Associe chaque événement à la bonne date. Toutes les associations doivent être correctes pour débloquer le défi 10.</p>${events.map((e,i)=>`<div class="timeline"><label for="t${i}">${escapeHTML(e[0])}</label><select id="t${i}"><option value="">Choisir une date</option>${['1985','2002','1957','1992','1951'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div>`).join('')}<div class="feedback" id="feedback"></div><button class="btn" id="verify" onclick="checkTimeline()">Vérifier la frise →</button>`}function checkTimeline(){let ok=events.every((e,i)=>document.querySelector('#t'+i).value===e[1]);if(ok){score++;document.querySelector('#feedback').className='feedback good';document.querySelector('#feedback').textContent='✓ Chronologie reconstituée !';document.querySelector('#verify').textContent='Dernier défi →';document.querySelector('#verify').onclick=next;document.querySelectorAll('select').forEach(e=>e.disabled=true)}else{document.querySelector('#feedback').className='feedback bad';document.querySelector('#feedback').textContent='Certaines dates ne correspondent pas. Réessaie !'}}render();
</script></body></html>
